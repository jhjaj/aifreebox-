<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AIFreeBox - Free AI Tools</title>
  <meta name="description" content="AIFreeBox - Free YouTube title generator and useful AI tools.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #5b2cff, #8b5cf6);
      color: white;
      text-align: center;
      padding: 45px 20px;
    }

    header h1 {
      font-size: 40px;
      margin-bottom: 12px;
    }

    header p {
      font-size: 17px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 30px 18px;
    }

    .generator {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
      margin-bottom: 30px;
    }

    .generator h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .generator p {
      text-align: center;
      color: #667085;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #5b2cff;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #5b2cff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4520d6;
    }

    #results {
      margin-top: 25px;
    }

    .title-box {
      background: #f8f9fc;
      border: 1px solid #e4e7ec;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 16px;
    }

    .copy-btn {
      background: #172033;
      padding: 8px 12px;
      width: auto;
      margin-top: 10px;
      font-size: 14px;
    }

    .copy-btn:hover {
      background: #000;
    }

    footer {
      margin-top: 20px;
      background: #172033;
      color: white;
      text-align: center;
      padding: 25px;
    }

    footer p {
      color: #cbd5e1;
      margin: 5px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🚀 AIFreeBox</h1>
    <p>Simple & Useful Free AI Tools</p>
  </header>

  <main class="container">

    <div class="generator">

      <h2>🎬 YouTube Title Generator</h2>

      <p>
        Enter your video topic and generate catchy YouTube title ideas.
      </p>

      <textarea
        id="topic"
        placeholder="Example: Funny Pakistani Kids Cartoon">
      </textarea>

      <button onclick="generateTitles()">
        ✨ Generate Titles
      </button>

      <div id="results"></div>

    </div>

  </main>

  <footer>
    <p>© 2026 AIFreeBox</p>
    <p>Free AI Tools for Creators</p>
  </footer>


  <script>

    function generateTitles() {

      const topic = document.getElementById("topic").value.trim();
      const results = document.getElementById("results");

      if (topic === "") {
        results.innerHTML =
          "<p>Please enter your video topic first.</p>";
        return;
      }

      const titles = [

        "🔥 " + topic + " | You Won't Believe What Happens Next!",

        "😂 " + topic + " | Funniest Video You Will Watch Today!",

        "😱 " + topic + " | This Was Totally Unexpected!",

        "❤️ " + topic + " | A Cute & Funny Story",

        "🎬 " + topic + " | Must Watch Till The End!"

      ];

      results.innerHTML = "";

      titles.forEach(function(title) {

        const box = document.createElement("div");

        box.className = "title-box";

        box.innerHTML =
          "<strong>" + title + "</strong>" +
          "<br>" +
          "<button class='copy-btn' onclick='copyTitle(this)'>Copy Title</button>";

        box.setAttribute("data-title", title);

        results.appendChild(box);

      });

    }


    function copyTitle(button) {

      const box = button.parentElement;

      const title = box.getAttribute("data-title");

      navigator.clipboard.writeText(title);

      button.innerText = "Copied ✓";

      setTimeout(function() {

        button.innerText = "Copy Title";

      }, 1500);

    }

  </script>

</body>
</html>
